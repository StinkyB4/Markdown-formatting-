<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d81b60" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paste Pretty" />
    <meta
      name="description"
      content="Paste messy text, copy it out fully formatted for Word and Google Docs. Works fully on your phone, no internet needed."
    />
    <title>Paste Pretty</title>
  </head>
  <body>
    <a class="skip-link" href="#input">Skip to paste box</a>

    <main class="app">
      <header class="app-header">
        <h1 class="app-title">Paste Pretty</h1>
        <p class="app-tagline" id="app-tagline">
          Let me eat your ugly Markdown text and spit out a beautifully
          formatted version for you to copy and paste.
        </p>
      </header>

      <div class="flavor-picker" role="group" aria-label="Choose a color flavor">
        <span class="flavor-label">Flavor</span>
        <div class="flavor-swatches">
          <button class="flavor-swatch" type="button" data-flavor="strawberry" aria-pressed="true" aria-label="Strawberry (pink)" title="Strawberry"></button>
          <button class="flavor-swatch" type="button" data-flavor="lime" aria-pressed="false" aria-label="Lime (green)" title="Lime"></button>
          <button class="flavor-swatch" type="button" data-flavor="orange" aria-pressed="false" aria-label="Orange cream" title="Orange cream"></button>
          <button class="flavor-swatch" type="button" data-flavor="blueberry" aria-pressed="false" aria-label="Blueberry (blue)" title="Blueberry"></button>
          <button class="flavor-swatch" type="button" data-flavor="grape" aria-pressed="false" aria-label="Grape (purple)" title="Grape"></button>
        </div>
      </div>

      <section class="step">
        <label class="step-label" for="input">
          <span class="step-number" aria-hidden="true">1</span>
          Paste your text here
        </label>
        <textarea
          id="input"
          class="input-box"
          aria-describedby="app-tagline"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Paste here…"
        ></textarea>
      </section>

      <section class="step">
        <p class="step-label">
          <span class="step-number" aria-hidden="true">2</span>
          Copy your text
        </p>
        <button id="copy-btn" class="copy-btn" type="button">
          Copy formatted text
        </button>
        <button id="clear-btn" class="clear-btn" type="button">
          Clear
        </button>
      </section>

      <!-- Persistent, high-contrast confirmation. Announced to screen readers.
           Stays until dismissed — never a fading toast. -->
      <div
        id="banner"
        class="banner"
        role="status"
        aria-live="assertive"
        hidden
      >
        <p id="banner-text" class="banner-text"></p>
        <button id="banner-dismiss" class="banner-dismiss" type="button">
          OK
        </button>
      </div>

      <section class="step preview-section">
        <button
          id="preview-toggle"
          class="preview-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="preview"
        >
          Preview — how it will look
        </button>
        <div id="preview" class="preview" aria-label="Preview of your formatted text"></div>
      </section>

      <details class="more-options">
        <summary class="more-options-summary">More options</summary>
        <div class="more-options-body">
          <button id="copy-md-btn" class="secondary-btn" type="button">
            Copy as plain Markdown
          </button>
          <button id="view-html-btn" class="secondary-btn" type="button">
            View HTML
          </button>
          <pre id="html-view" class="html-view" hidden></pre>
        </div>
      </details>

      <footer class="app-footer">
        <span class="app-copyright">&copy; 2026</span>
        <a class="dulos-brand" href="https://dulos.net" rel="noopener" aria-label="dulos.net">
          <svg class="dulos-mark" width="24" height="24" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <text
              x="20"
              y="21"
              text-anchor="middle"
              dominant-baseline="central"
              font-family="Georgia, 'Times New Roman', serif"
              font-weight="700"
              font-size="30"
              fill="#c8a96e"
            >δ</text>
          </svg>
          <span class="dulos-name">dulos<span class="dulos-tld">.net</span></span>
        </a>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
